  'ApplyAppConfigV2@cs.csm.fun':
    id: 'ApplyAppConfigV2@cs.csm.fun'
    name: 'ApplyAppConfigV2'
    type: 'function'
    description: |-
      Idempotent endpoint that creates or updates an Extend app from a declarative spec.
      Uses three-way merge semantics (kubectl apply) for variables, secrets, and permissions.

      Note: `preferred_k8s_namespace` is only used on the initial create call; it is ignored on subsequent apply calls.
      On the first apply after creation the deletion phase is skipped (no prior apply state recorded).
    arguments:
      'App':
        type: 'string'
        required: true
        description: |-
          App Name. Expected format: (^[A-Za-z](?:[A-Za-z0-9\-]*[A-Za-z0-9])?$)
      'Body':
        type: 'ApimodelApplyAppConfigRequest'
        required: true
      'Namespace':
        type: 'string'
        required: true
        description: |-
          Game Namespace
    return_type: 'ApimodelAppItem'
    imports:
      - 'using AccelByte.Sdk.Core;'
      - 'using AccelByte.Sdk.Api.Csm.Model;'
      - 'using AccelByte.Sdk.Api.Csm.Operation;'
      - 'using AccelByte.Sdk.Api.Csm.Wrapper;'
    files:
      - 'https://github.com/AccelByte/accelbyte-csharp-sdk/blob/main/AccelByte.Sdk/Api/Csm/Wrapper/AppV2.cs'
      - 'https://github.com/AccelByte/accelbyte-csharp-sdk/blob/main/AccelByte.Sdk/Api/Csm/Operation/AppV2/ApplyAppConfigV2.cs'
    example: |-
      try
      {
          var operation = sdk.Csm.AppV2.ApplyAppConfigV2Op
              .Build();

          var response = sdk.Csm.AppV2.ApplyAppConfigV2(operation);
      }
      catch (HttpResponseException e) { /* Handle exceptions. */ }
      catch (Exception e)             { /* Handle exceptions. */ }
    tags:
      - 'app'
      - 'apply'
      - 'config'
      - 'v2'
    permissions:
      - 'ADMIN:NAMESPACE:{namespace}:EXTEND:APP []'

  'BulkSaveSubscriptionAppNotificationV2@cs.csm.fun':
    id: 'BulkSaveSubscriptionAppNotificationV2@cs.csm.fun'
    name: 'BulkSaveSubscriptionAppNotificationV2'
    type: 'function'
    description: |-
      Bulk update of users subscribed to an app's notifications.

      Request body:
      - notificationType : type of the app notification to be subscribed - Required.
      - values:
      - "all"
      - "app-down"
      - "critical-vulnerability"
      - subscribers : user(s) notification subscription to be updated - Required.
    arguments:
      'App':
        type: 'string'
        required: true
        description: |-
          App Name
      'Body':
        type: 'ApimodelBulkSubscribeRequest'
        required: true
      'Namespace':
        type: 'string'
        required: true
        description: |-
          Game Namespace
    return_type: 'ApimodelGetNotificationSubscriberListResponse'
    imports:
