  'ApplyAppConfigV2@jv.csm.fun':
    id: 'ApplyAppConfigV2@jv.csm.fun'
    name: 'ApplyAppConfigV2'
    type: 'function'
    description: |-
      Idempotent endpoint that creates or updates an Extend app from a declarative spec.
      Uses three-way merge semantics (kubectl apply) for variables, secrets, and permissions.

      Note: `preferred_k8s_namespace` is only used on the initial create call; it is ignored on subsequent apply calls.
      On the first apply after creation the deletion phase is skipped (no prior apply state recorded).
    arguments:
      'app':
        type: 'String'
        required: true
        description: |-
          App Name. Expected format: (^[A-Za-z](?:[A-Za-z0-9\-]*[A-Za-z0-9])?$)
      'body':
        type: 'ApimodelApplyAppConfigRequest'
        required: true
      'namespace':
        type: 'String'
        required: true
        description: |-
          Game Namespace
    return_type: 'ApimodelAppItem'
    imports:
      - 'import net.accelbyte.sdk.core.*;'
      - 'import net.accelbyte.sdk.api.csm.models.*;'
      - 'import net.accelbyte.sdk.api.csm.operations.app_v2.*;'
      - 'import net.accelbyte.sdk.api.csm.wrappers.*;'
    files:
      - 'https://github.com/AccelByte/accelbyte-java-sdk/blob/main/src/main/java/net/accelbyte/sdk/api/csm/wrappers/AppV2.java'
      - 'https://github.com/AccelByte/accelbyte-java-sdk/blob/main/src/main/java/net/accelbyte/sdk/api/csm/operations/app_v2/ApplyAppConfigV2.java'
    example: |-
      try {
          final ApplyAppConfigV2 operation = ApplyAppConfigV2.builder()
              .build(
                  app,
                  body,
                  namespace,
              );

          final AppV2 wrapper = new AppV2(sdk);
          final ApimodelAppItem response = wrapper.applyAppConfigV2(operation);
      }
      catch (HttpResponseException e) { /* Handle exceptions. */ }
      catch (Exception e)             { /* Handle exceptions. */ }
    tags:
      - 'app'
      - 'apply'
      - 'config'
      - 'v2'
    permissions:
      - 'ADMIN:NAMESPACE:{namespace}:EXTEND:APP []'

  'BulkSaveSubscriptionAppNotificationV2@jv.csm.fun':
    id: 'BulkSaveSubscriptionAppNotificationV2@jv.csm.fun'
    name: 'BulkSaveSubscriptionAppNotificationV2'
    type: 'function'
    description: |-
      Bulk update of users subscribed to an app's notifications.

      Request body:
      - notificationType : type of the app notification to be subscribed - Required.
      - values:
      - "all"
      - "app-down"
      - "critical-vulnerability"
      - subscribers : user(s) notification subscription to be updated - Required.
    arguments:
      'app':
        type: 'String'
        required: true
        description: |-
          App Name
      'body':
        type: 'ApimodelBulkSubscribeRequest'
